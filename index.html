<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><title>Manthos Habits</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Manthos">
<style>
:root{--bg:#090909;--card:#151515;--card2:#1b1b1b;--text:#f6f5f1;--muted:#949494;--gold:#f5c400;--line:#2a2a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
#splash{position:fixed;z-index:99;inset:0;background:#090909;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}.smark{width:104px;height:104px;object-fit:contain}.sbrand{font-weight:900;letter-spacing:.20em;margin-top:22px;font-size:14px}.stag{color:var(--muted);font-size:13px;margin-top:8px}
.app{max-width:620px;margin:auto;min-height:100vh;padding:20px 18px 96px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.word{width:160px;max-height:44px;object-fit:contain;object-position:left center}
.avatar{width:70px;height:70px;border-radius:50%;border:1px solid #343434;background:#101010;display:grid;place-items:center;overflow:hidden;cursor:pointer;box-shadow:0 0 0 4px rgba(255,255,255,.02)}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.default img{object-fit:contain;padding:8px}
.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.15em}.muted{color:var(--muted);line-height:1.48}
h1{font-size:34px;letter-spacing:-.045em;margin:6px 0 8px}h2{font-size:19px;margin:0}
.goal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0;cursor:pointer}
.goalTop{display:flex;justify-content:space-between;align-items:center}.goal b{font-size:14px}.goal p{margin:9px 0 0;color:#dbdbd7;line-height:1.42}.placeholder{color:#777!important}
.miniScore{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin:18px 0}.miniScore strong{font-size:24px}.up{color:var(--gold)}
.pillar{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:11px 0;cursor:pointer}.pillarHead{display:flex;justify-content:space-between;align-items:center}.pillarHead strong{font-size:21px}.pct{font-size:25px;font-weight:900}.pillar p{color:var(--muted);font-size:13px;line-height:1.42;margin:8px 0 0}
.bar{height:6px;background:#282828;border-radius:9px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:var(--gold)}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#101010;border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
.nav{border:0;background:none;color:#858585;font-weight:800;font-size:11px;padding:7px}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--gold)}
.back{border:0;background:none;color:#ddd;padding:0 0 15px;font-size:15px}
.habit{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:14px;border-radius:15px;margin:9px 0}.habit small{display:block;color:var(--muted);margin-top:4px}.counter{display:flex;align-items:center;gap:8px}.round{width:34px;height:34px;border-radius:50%;background:#202020;border:1px solid #363636;color:white;font-size:20px}.count{min-width:22px;text-align:center;font-weight:900}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:900}.primary{background:var(--gold);color:#090909}.secondary{background:#202020;color:white;border:1px solid var(--line)}
.weeknav{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:15px 0}.day{background:#151515;border:1px solid var(--line);border-radius:12px;color:#aaa;padding:9px 2px;text-align:center;font-size:10px}.day b{display:block;font-size:16px;color:#eee;margin-top:4px}.day.active{border-color:var(--gold);color:var(--gold)}.day.active b{color:var(--gold)}
textarea,input{width:100%;background:#171717;border:1px solid var(--line);border-radius:13px;color:white;padding:13px;font:inherit}textarea{min-height:110px;resize:vertical}.photo{width:100%;max-height:280px;object-fit:cover;border-radius:15px;margin-top:10px}
.reviewCard{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0}.reviewCard h3{margin:0 0 8px}.checks{color:#bdbdbd;font-size:13px;line-height:1.6}
.infoHero{text-align:center;padding:8px 0 18px}.infoHero img{width:92px;height:92px;object-fit:contain}.info{border:1px solid var(--line);border-radius:18px;padding:17px;margin:11px 0;background:var(--card)}.num{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.12em}.info h2{margin:5px 0}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:16px}.flow div{text-align:center;background:#171717;border-radius:10px;padding:10px 3px;font-size:10px}.flow b{display:block;color:var(--gold);font-size:17px;margin-bottom:4px}
</style>
<style id="v32-clean-branding">
/* V3.2 branding correction: keep transparent PNG artwork visually transparent. */
img[src*="logo"], img[alt*="Manthos"], .brand img, .logo img, .logo,
img[src*="profile"], .profile img, .avatar img {
  background: transparent !important;
  background-color: transparent !important;
  box-shadow: none !important;
  border: 0 !important;
}

/* The Manthos wordmark should float directly on the app background. */
.brand, .logo, .brand-logo, .wordmark {
  background: transparent !important;
  background-color: transparent !important;
  box-shadow: none !important;
  border: 0 !important;
}
</style>

<script>
setTimeout(()=>document.getElementById("splash").classList.add("hide"),1050);
const P={
"Fysiek":{desc:"Bouw aan een lichaam waarop je kunt vertrouwen.",defaults:[["Trainen",3],["Bewust bewegen",5],["Herstel serieus nemen",5]]},
"Relaties":{desc:"Investeer bewust in de mensen die ertoe doen.",defaults:[["Bewuste tijd voor thuis",5],["Echt gesprek",3]]},
"Ontwikkeling":{desc:"Werk aan vakmanschap, richting en financiële verantwoordelijkheid.",defaults:[["Werken aan mijn doel",4],["Leren of lezen",3],["Financiën op orde",1]]}
};
const names=Object.keys(P);
function fresh(){let s={goals:{"30":"","90":"","365":""},habits:{},logs:{},journal:{},avatar:null};names.forEach(p=>s.habits[p]=P[p].defaults.map((x,i)=>({id:p+i,name:x[0],target:x[1]})));localStorage.setItem("mh31",JSON.stringify(s));return s}
function load(){try{return JSON.parse(localStorage.getItem("mh31"))||fresh()}catch(e){return fresh()}}let S=load(),curP=null,selected=new Date();
function save(){localStorage.setItem("mh31",JSON.stringify(S))}
function key(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function monday(d=new Date()){let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x}
function dates(off=0){let m=monday();m.setDate(m.getDate()+off*7);return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(d.getDate()+i);return key(d)})}
function count(id,ds=dates()){return ds.reduce((a,k)=>a+((S.logs[k]&&S.logs[k][id])||0),0)}
function ps(p,ds=dates()){let h=S.habits[p]||[];if(!h.length)return 0;return Math.round(h.reduce((a,x)=>a+Math.min(count(x.id,ds)/x.target,1),0)/h.length*100)}
function total(ds=dates()){return Math.round(names.reduce((a,p)=>a+ps(p,ds),0)/names.length)}
function esc(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function nav(x){["track","review","info"].forEach(n=>document.getElementById("n-"+n).classList.toggle("active",n===x))}

function page(x,arg){window.scrollTo(0,0);if(x==="home")home();if(x==="tracker")tracker();if(x==="pillar")pillar(arg);if(x==="review")review();if(x==="info")info();avatar()}
function home(){nav("");let t=total(),pr=total(dates(-1)),d=t-pr;document.getElementById("main").innerHTML=`
<div class="eyebrow">JOUW RICHTING</div><h1>Waar wil je staan?</h1><div class="muted">Formuleer eerst waar je naartoe werkt. De tracker is alleen het bewijs van wat je dagelijks doet.</div>
${[["30","30 DAGEN"],["90","90 DAGEN"],["365","1 JAAR"]].map(g=>`<div class="goal" onclick="editGoal('${g[0]}')"><div class="goalTop"><b>${g[1]}</b><span>✎</span></div><p class="${S.goals[g[0]]?"":"placeholder"}">${esc(S.goals[g[0]]||"Tik om je doel te formuleren…")}</p></div>`).join("")}
<div class="miniScore"><div><div class="eyebrow">DEZE WEEK</div><strong>${t}%</strong></div><div class="${d>0?"up":"muted"}">${d>0?"↑ "+d+"%":d<0?"↓ "+Math.abs(d)+"%":"gelijk"} t.o.v. vorige week</div></div>`}
function editGoal(k){let labels={"30":"Waar wil je over 30 dagen staan?","90":"Waar wil je over 90 dagen staan?","365":"Waar wil je over 1 jaar staan?"};let v=prompt(labels[k],S.goals[k]);if(v!==null){S.goals[k]=v.trim();save();home()}}
function tracker(){nav("track");document.getElementById("main").innerHTML=`<div class="eyebrow">TRACKER</div><h1>Wat doe je vandaag?</h1><div class="muted">Je doelen geven richting. Je gewoontes bepalen of je er komt.</div>${names.map(p=>`<div class="pillar" onclick="page('pillar','${p}')"><div class="pillarHead"><strong>${p}</strong><div class="pct">${ps(p)}%</div></div><p>${P[p].desc}</p><div class="bar"><i style="width:${ps(p)}%"></i></div></div>`).join("")}`}
function pillar(p){curP=p;nav("track");let today=key();document.getElementById("main").innerHTML=`<button class="back" onclick="page('tracker')">← Tracker</button><div class="eyebrow">PIJLER</div><h1>${p}</h1><div class="muted">${P[p].desc}</div><div class="pillar"><div class="pillarHead"><strong>Deze week</strong><div class="pct">${ps(p)}%</div></div><div class="bar"><i style="width:${ps(p)}%"></i></div></div>${V33.renderWeeklyTip(p)}<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px"><h2>Mijn gewoontes</h2><button class="btn primary" onclick="addHabit()">+ toevoegen</button></div>${(S.habits[p]||[]).map(h=>{let td=(S.logs[today]&&S.logs[today][h.id])||0;return`<div class="habit"><div><b>${esc(h.name)}</b><small>${count(h.id)}/${h.target} deze week · vandaag ${td}</small></div><div class="counter"><button class="round" onclick="chg('${h.id}',-1)">−</button><span class="count">${td}</span><button class="round" onclick="chg('${h.id}',1)">+</button></div></div>`}).join("")}<p class="muted" style="font-size:12px">Je eigen norm is 100%. Extra uitvoering wordt opgeslagen, maar geeft geen score boven 100%.</p>`}
function chg(id,n){let k=key();S.logs[k]=S.logs[k]||{};S.logs[k][id]=Math.max(0,(S.logs[k][id]||0)+n);save();pillar(curP)}
function addHabit(){let n=prompt("Welke gewoonte wil je volgen?");if(!n)return;let t=parseInt(prompt("Hoe vaak per week?","3"));if(!t||t<1)return;S.habits[curP].push({id:curP+Date.now(),name:n.trim(),target:t});save();pillar(curP)}
function weekOf(d){let m=monday(d);return Array.from({length:7},(_,i)=>{let x=new Date(m);x.setDate(x.getDate()+i);return x})}
function review(){nav("review");let days=weekOf(selected),sk=key(selected),j=S.journal[sk]||{},log=S.logs[sk]||{};let done=[];names.forEach(p=>(S.habits[p]||[]).forEach(h=>{let n=log[h.id]||0;if(n)done.push(`${p}: ${h.name} × ${n}`)}));document.getElementById("main").innerHTML=`<div class="eyebrow">REVIEW</div><h1>${selected.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})}</h1><div class="weeknav">${days.map(d=>`<button class="day ${key(d)===sk?"active":""}" onclick="selDay('${key(d)}')">${d.toLocaleDateString("nl-NL",{weekday:"short"}).slice(0,2)}<b>${d.getDate()}</b></button>`).join("")}</div><div class="reviewCard"><h3>Uitvoering</h3><div class="checks">${done.length?done.map(x=>"✓ "+esc(x)).join("<br>"):"Nog niets geregistreerd op deze dag."}</div></div><div class="reviewCard"><h3>Dagnotitie</h3><textarea id="jnote" placeholder="Wat viel vandaag op?">${esc(j.text||"")}</textarea><input type="file" accept="image/*" onchange="journalPhoto(event)" style="margin-top:9px">${j.photo?`<img id="jphoto" class="photo" src="${j.photo}">`:`<img id="jphoto" class="photo" style="display:none">`}<button class="btn primary" style="width:100%;margin-top:10px" onclick="saveJournal()">Bewaren</button></div>`}
function selDay(k){selected=new Date(k+"T12:00:00");review()}let pending=null;
function journalPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement("canvas"),sc=Math.min(1,800/im.width,800/im.height);c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pending=c.toDataURL("image/jpeg",.68);let p=document.getElementById("jphoto");p.src=pending;p.style.display="block"};im.src=r.result};r.readAsDataURL(f)}
function saveJournal(){let k=key(selected),old=S.journal[k]||{};S.journal[k]={text:document.getElementById("jnote").value,photo:pending||old.photo||null};pending=null;save();alert("Dag opgeslagen.")}
